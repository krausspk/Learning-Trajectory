[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-trajectory"
version = "0.1.0"
description = "Independent reproduction of Krauss et al. (2026), doi:10.3389/fcogn.2026.1960468"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy==1.23.5", "scipy==1.10.1", "torch==2.8.0",
  "pandas==2.0.3", "matplotlib==3.7.5", "threadpoolctl==3.6.0"
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
learning-trajectory = "learning_trajectory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
